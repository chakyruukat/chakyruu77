<!DOCTYPE html>
<html lang="ky">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Аскар & Ажар | Үйлөнүү тою</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    background:#211d1a;
    overflow-x:hidden;
}

body{
    font-family:Georgia,"Times New Roman",serif;
}

/* =========================
   АЧУУ ЭКРАНЫ
========================= */

#opening{
    position:fixed;
    inset:0;
    z-index:9999;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        linear-gradient(
            rgba(45,30,20,.15),
            rgba(45,30,20,.45)
        ),
        url("assets/invitation.png") center top/cover no-repeat;

    transition:
        opacity 1s ease,
        visibility 1s ease;
}

#opening.hide{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
}

.open-card{
    width:88%;
    max-width:430px;

    text-align:center;

    padding:42px 25px;

    background:rgba(245,230,210,.94);

    border-radius:12px;

    box-shadow:
        0 25px 70px rgba(0,0,0,.5);
}

.open-names{
    font-size:30px;
    color:#6d4931;
    margin-bottom:8px;
}

.open-subtitle{
    font-size:11px;
    letter-spacing:5px;
    color:#87644c;
    margin-bottom:35px;
}

.seal{
    width:70px;
    height:70px;
    margin:auto;
    margin-bottom:25px;

    border-radius:50%;

    background:#81502f;
    color:#f9ead9;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:28px;
}

.open-btn{
    border:none;
    padding:15px 65px;

    border-radius:40px;

    background:#744625;
    color:white;

    font-size:17px;
    letter-spacing:3px;

    cursor:pointer;

    box-shadow:0 7px 20px rgba(80,40,20,.35);
}

.open-btn:active{
    transform:scale(.96);
}

/* =========================
   НЕГИЗГИ ЧАКЫРУУ
========================= */

.invitation{
    position:relative;
    width:100%;
    max-width:900px;
    margin:auto;

    background:#eee0cf;
}

.invitation img{
    display:block;
    width:100%;
    height:auto;
}

/* =========================
   МУЗЫКА
========================= */

#musicBtn{
    position:fixed;

    top:18px;
    right:18px;

    width:58px;
    height:58px;

    border-radius:50%;

    border:1px solid rgba(255,255,255,.3);

    background:rgba(91,55,34,.9);

    color:white;

    font-size:23px;

    z-index:7000;

    cursor:pointer;
}

/* =========================
   ЧЫНЫГЫ КНОПКАЛАР
========================= */

.real-btn{
    position:absolute;

    border:none;

    border-radius:30px;

    background:#754526;

    color:white;

    font-size:13px;

    padding:13px 20px;

    cursor:pointer;

    box-shadow:
        0 5px 15px rgba(70,35,15,.35);

    z-index:20;

    text-decoration:none;

    text-align:center;
}

.real-btn:active{
    transform:scale(.96);
}

/* карта */

.map-btn{
    top:52.4%;
    right:8%;

    width:30%;
}

/* тойго келем */

.yes-btn{
    top:61.4%;
    right:8%;

    width:20%;

    background:#754526;
}

/* келе албайм */

.no-btn{
    top:61.4%;
    right:29%;

    width:22%;

    background:#eee5da;

    color:#65452f;

    border:1px solid #cdb49b;

    box-shadow:none;
}

/* аты */

.name-input{
    position:absolute;

    top:64.9%;
    right:7.5%;

    width:43%;

    height:38px;

    border-radius:20px;

    border:1px solid #d9c3ad;

    background:rgba(255,250,244,.9);

    padding:0 16px;

    color:#5b412e;

    z-index:30;

    outline:none;
}

/* конок саны */

.count-input{
    position:absolute;

    top:68.4%;
    right:7.5%;

    width:43%;

    height:38px;

    border-radius:20px;

    border:1px solid #d9c3ad;

    background:rgba(255,250,244,.9);

    padding:0 16px;

    color:#5b412e;

    z-index:30;

    outline:none;
}

/* WhatsApp */

.whatsapp-btn{
    top:71.6%;
    right:7.5%;

    width:44%;
}

/* =========================
   ТИЛЕК
========================= */

.wish-input{
    position:absolute;

    top:77.2%;
    left:12%;

    width:39%;

    height:55px;

    border-radius:12px;

    border:1px solid #d8c1a8;

    background:rgba(255,250,244,.9);

    padding:12px;

    resize:none;

    color:#5b412e;

    z-index:30;

    outline:none;
}

.wish-btn{
    top:82.1%;
    left:12%;

    width:39%;
}

/* =========================
   КЕЛДИМ / КЕЛЕ АЛБАЙМ
========================= */

.selected{
    box-shadow:
        0 0 0 3px rgba(117,69,38,.3);
}

/* =========================
   МОБИЛЬ
========================= */

@media(max-width:600px){

    .real-btn{
        font-size:9px;
        padding:7px 8px;
    }

    .map-btn{
        top:52.4%;
        right:7%;
        width:31%;
    }

    .yes-btn{
        top:61.5%;
        right:7%;
        width:21%;
    }

    .no-btn{
        top:61.5%;
        right:29%;
        width:23%;
    }

    .name-input{
        top:65%;
        right:7%;
        width:44%;
        height:30px;
        font-size:10px;
    }

    .count-input{
        top:68.5%;
        right:7%;
        width:44%;
        height:30px;
        font-size:10px;
    }

    .whatsapp-btn{
        top:71.8%;
        right:7%;
        width:45%;
    }

    .wish-input{
        top:77.4%;
        left:11%;
        width:40%;
        height:42px;
        font-size:10px;
    }

    .wish-btn{
        top:82.3%;
        left:11%;
        width:40%;
    }
}
</style>
</head>

<body>


<!-- =========================
     АЧУУ
========================= -->

<div id="opening">

    <div class="open-card">

        <div class="open-names">
            Аскар & Ажар
        </div>

        <div class="open-subtitle">
            ҮЙЛӨНҮҮ ТОЮ
        </div>

        <div class="seal">
            ♡
        </div>

        <button
            class="open-btn"
            id="openBtn">
            АЧУУ
        </button>

    </div>

</div>


<!-- =========================
     МУЗЫКА
========================= -->

<audio
    id="music"
    loop
    preload="auto">

    <source
        src="assets/wedding-music.mp3"
        type="audio/mpeg">

</audio>


<button
    id="musicBtn">
    ♫
</button>


<!-- =========================
     ЧАКЫРУУ
========================= -->

<div
    class="invitation"
    id="invitation">


    <img
        src="assets/invitation.png"
        alt="Аскар жана Ажар">


    <!-- КАРТА -->

    <a
        class="real-btn map-btn"
        href="https://2gis.kg/bishkek/geo/70000001033577160"
        target="_blank">

        КАРТАДАН КӨРҮҮ

    </a>


    <!-- ООБА -->

    <button
        class="real-btn yes-btn"
        id="yesBtn">

        ✓ Ооба, келебиз

    </button>


    <!-- ЖОК -->

    <button
        class="real-btn no-btn"
        id="noBtn">

        × Келе албайбыз

    </button>


    <!-- АТЫ -->

    <input
        class="name-input"
        id="guestName"
        type="text"
        placeholder="Атыңызды жазыңыз">


    <!-- КОНУКТАР -->

    <input
        class="count-input"
        id="guestCount"
        type="number"
        min="1"
        placeholder="Канча киши келесиз?">


    <!-- WHATSAPP -->

    <button
        class="real-btn whatsapp-btn"
        id="sendRsvp">

        ☎ ЖӨНӨТҮҮ (WhatsApp аркылуу)

    </button>


    <!-- ТИЛЕК -->

    <textarea
        class="wish-input"
        id="wishText"
        placeholder="Тилегиңизди жазыңыз..."></textarea>


    <button
        class="real-btn wish-btn"
        id="sendWish">

        ✈ ЖӨНӨТҮҮ

    </button>

</div>


<script>

/* =========================
   ЭЛЕМЕНТТЕР
========================= */

const opening =
    document.getElementById("opening");

const openBtn =
    document.getElementById("openBtn");

const music =
    document.getElementById("music");

const musicBtn =
    document.getElementById("musicBtn");

const yesBtn =
    document.getElementById("yesBtn");

const noBtn =
    document.getElementById("noBtn");

const sendRsvp =
    document.getElementById("sendRsvp");

const sendWish =
    document.getElementById("sendWish");

const guestName =
    document.getElementById("guestName");

const guestCount =
    document.getElementById("guestCount");

const wishText =
    document.getElementById("wishText");


/* =========================
   АЧУУ + МУЗЫКА + АВТО ЖЫЛУУ
========================= */

openBtn.addEventListener(
    "click",
    async function(){

        opening.classList.add("hide");

        try{

            await music.play();

            musicBtn.textContent="Ⅱ";

        }catch(error){

            musicBtn.textContent="♫";

        }


        /*
        Чакыруу ачылгандан кийин
        өзү акырын жылат
        */

        setTimeout(
            startAutoScroll,
            1000
        );

    }
);


/* =========================
   АВТОМАТТЫК ЖЫЛУУ
========================= */

let autoScrolling=false;

function startAutoScroll(){

    if(autoScrolling) return;

    autoScrolling=true;

    const speed=0.55;

    function scroll(){

        if(!autoScrolling)
            return;

        const current =
            window.scrollY;

        const max =
            document.documentElement.scrollHeight
            -
            window.innerHeight;

        if(current >= max){

            autoScrolling=false;

            return;

        }

        window.scrollTo(
            0,
            current + speed
        );

        requestAnimationFrame(scroll);

    }

    requestAnimationFrame(scroll);

}


/* =========================
   МУЗЫКА
========================= */

musicBtn.addEventListener(
    "click",
    function(){

        if(music.paused){

            music.play();

            musicBtn.textContent="Ⅱ";

        }else{

            music.pause();

            musicBtn.textContent="♫";

        }

    }
);


/* =========================
   КЕЛЕБИЗ
========================= */

yesBtn.addEventListener(
    "click",
    function(){

        yesBtn.classList.add("selected");

        noBtn.classList.remove("selected");

    }
);


/* =========================
   КЕЛЕ АЛБАЙБЫЗ
========================= */

noBtn.addEventListener(
    "click",
    function(){

        noBtn.classList.add("selected");

        yesBtn.classList.remove("selected");

    }
);


/* =========================
   WHATSAPP
========================= */

sendRsvp.addEventListener(
    "click",
    function(){

        const name =
            guestName.value.trim();

        const count =
            guestCount.value.trim();

        let answer="";

        if(
            yesBtn.classList.contains("selected")
        ){

            answer="Ооба, келебиз";

        }else if(
            noBtn.classList.contains("selected")
        ){

            answer="Келе албайбыз";

        }else{

            answer="Жооп белгисиз";

        }


        const message =
            "Саламатсызбы! Аскар & Ажардын тоюна байланыштуу:%0A%0A"
            +
            "Аты: "
            +
            encodeURIComponent(name || "Көрсөтүлгөн эмес")
            +
            "%0A"
            +
            "Жооп: "
            +
            encodeURIComponent(answer)
            +
            "%0A"
            +
            "Коноктордун саны: "
            +
            encodeURIComponent(count || "Көрсөтүлгөн эмес");


        /*
        Бул номерди кийин
        той ээлеринин чыныгы
        WhatsApp номерине алмаштырабыз.
        */

        const phone="996700000000";


        window.open(
            "https://wa.me/"
            +
            phone
            +
            "?text="
            +
            message,
            "_blank"
        );

    }
);


/* =========================
   ТИЛЕК ЖӨНӨТҮҮ
========================= */

sendWish.addEventListener(
    "click",
    function(){

        const wish =
            wishText.value.trim();

        if(!wish){

            alert(
                "Алгач тилегиңизди жазыңыз ❤️"
            );

            return;

        }


        const message =
            "Аскар & Ажарга тилек:%0A%0A"
            +
            encodeURIComponent(wish);


        const phone="996705206363";


        window.open(
            "https://wa.me/"
            +
            phone
            +
            "?text="
            +
            message,
            "_blank"
        );

    }
);

</script>

</body>
</html>
